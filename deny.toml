[advisories]
yanked = "deny"

[licenses]
# Our own crates are unpublished and proprietary; skip them, check dependencies.
private = { ignore = true }
allow = [
    "CDLA-Permissive-2.0",   # webpki-roots CA certificate data
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

[bans]
wildcards = "deny"
# Admit only the reviewed webpki-roots 1.0.12. RUSTSEC-2026-0381 lists 1.0.10
# as patched, and a later version's root data is unreviewed.
deny = [
    { name = "webpki-roots", version = "<1.0.12" },
    { name = "webpki-roots", version = ">1.0.12" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
