name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked CLI version
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/ci.yml
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: python3 scripts/release-version.py
  build:
    needs: [check, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes musl-tools
      - env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked --target "$TARGET"
      - env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          binary=proofline
          if [[ "$TARGET" == *windows* ]]; then binary=proofline.exe; fi
          test "$(target/"$TARGET"/release/"$binary" --version)" = "proofline $VERSION"
          python3 scripts/archive.py "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: artifacts
      - env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find artifacts -name '*.tar.gz' | wc -l)" -eq 5
          (cd artifacts && LC_ALL=C sha256sum proofline-*.tar.gz > SHA256SUMS)
          printf '%s\n' "$VERSION" > artifacts/latest
          # Creating the draft reserves the GitHub version atomically.
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Proofline $VERSION" --generate-notes
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*.tar.gz
      - env:
          VERSION: ${{ needs.version.outputs.version }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLI_RELEASE_R2_CREDENTIALS: ${{ secrets.CLI_RELEASE_R2_CREDENTIALS }}
        run: scripts/publish-r2.sh "$VERSION" artifacts
      - env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$VERSION" artifacts/* --repo "$GITHUB_REPOSITORY"
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          for archive in artifacts/*.tar.gz; do
            name=$(basename "$archive")
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location "https://proofline.sh/cli/download/$VERSION/$name" -o "/tmp/$name"
            cmp "$archive" "/tmp/$name"
          done
