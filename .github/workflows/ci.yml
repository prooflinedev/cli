name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo install cargo-deny --locked --version 0.20.2 && cargo deny check

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - run: python scripts/archive.py x86_64-pc-windows-msvc
      - name: Check packaged archive with PowerShell 5.1 and PowerShell 7
        shell: pwsh
        run: |
          $archive = 'artifacts/proofline-x86_64-pc-windows-msvc.tar.gz'
          $built = 'target/x86_64-pc-windows-msvc/release/proofline.exe'
          foreach ($engine in @('powershell.exe', 'pwsh.exe')) {
            & $engine -NoProfile -NonInteractive -File scripts/check_windows_release_archive.ps1 -ArchivePath $archive -ExecutablePath $built
            if ($LASTEXITCODE -ne 0) { throw "$engine rejected the packaged Windows executable." }
          }
          tar -xzf $archive -C artifacts
          if ((Get-FileHash -LiteralPath './artifacts/proofline.exe' -Algorithm SHA256).Hash -cne
              (Get-FileHash -LiteralPath $built -Algorithm SHA256).Hash) {
            throw 'Smoke-tested Windows executable differs from installer-validated archive.'
          }
          & ./artifacts/proofline.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Windows executable failed" }
          & ./artifacts/proofline.exe setup --print
          if ($LASTEXITCODE -ne 0) { throw "Setup handoff failed" }
          & ./artifacts/proofline.exe review --schema | ConvertFrom-Json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Review schema failed" }
