name: Hosted install check
# Runs the reviewed hosted installer into a disposable prefix on the publisher's
# runner image and reads back the installed version and digests. It never
# builds, publishes or writes release objects; it only reads proofline.sh,
# the same origin the publish job already compares against.
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: hosted-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: 0.1.7
      TARGET: x86_64-unknown-linux-musl
      # Digests from the v0.1.7 assets published by Release run 41123276320.
      ARCHIVE_SHA256: fb13dbd429c1e61f9fb6d8974e3b17792f65b5882e4623a37a335590e000fe13
      CHECKSUMS_SHA256: c5b9c6ebb2cf7729fefe29ee3137655e757a01685501374afbd3da094ac614c6
      # Reviewed installer: proofline 0421e803, apps/marketing/public/cli/install.sh.
      INSTALLER_SHA256: da5e9d49eaa193a9f98d002b799c7b432129ac1f9c746295abf19ca1f613f567
    steps:
      - run: |
          set -euo pipefail
          fetch() {
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 120 "$@"
          }
          work=$(mktemp -d "$RUNNER_TEMP/hosted-install.XXXXXX")
          prefix="$work/bin"
          mkdir -p "$prefix" "$work/expected"

          latest=$(fetch https://proofline.sh/cli/latest)
          [ "$latest" = "$VERSION" ] || { echo "latest is $latest, expected $VERSION" >&2; exit 1; }
          fetch "https://proofline.sh/cli/download/$VERSION/SHA256SUMS" -o "$work/SHA256SUMS"
          echo "$CHECKSUMS_SHA256  $work/SHA256SUMS" | sha256sum --check --strict

          name="proofline-$TARGET.tar.gz"
          grep -Fx "$ARCHIVE_SHA256  $name" "$work/SHA256SUMS"
          fetch "https://proofline.sh/cli/download/$VERSION/$name" -o "$work/$name"
          echo "$ARCHIVE_SHA256  $work/$name" | sha256sum --check --strict
          [ "$(tar -tzf "$work/$name")" = proofline ]
          tar -xzf "$work/$name" -C "$work/expected" proofline

          # Refuse installer bytes that differ from the reviewed source before running them.
          fetch https://proofline.sh/cli -o "$work/install.sh"
          echo "$INSTALLER_SHA256  $work/install.sh" | sha256sum --check --strict
          PROOFLINE_NO_UPDATE_CHECK=1 PROOFLINE_VERSION="$VERSION" PROOFLINE_INSTALL_DIR="$prefix" \
            sh "$work/install.sh"

          [ -f "$prefix/proofline" ] && [ ! -L "$prefix/proofline" ]
          installed=$(PROOFLINE_NO_UPDATE_CHECK=1 "$prefix/proofline" --version)
          [ "$installed" = "proofline $VERSION" ] || { echo "installed $installed" >&2; exit 1; }
          cmp "$work/expected/proofline" "$prefix/proofline"
          binary_sha256=$(sha256sum "$prefix/proofline" | cut -d ' ' -f 1)

          {
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Workflow commit | \`$GITHUB_SHA\` |"
            echo "| Published latest | \`$latest\` |"
            echo "| SHA256SUMS sha256 | \`$CHECKSUMS_SHA256\` |"
            echo "| Installed version | \`$installed\` |"
            echo "| Installer sha256 | \`$INSTALLER_SHA256\` |"
            echo "| Archive | \`https://proofline.sh/cli/download/$VERSION/$name\` |"
            echo "| Archive sha256 | \`$ARCHIVE_SHA256\` |"
            echo "| Binary sha256 | \`$binary_sha256\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
